openapi: 3.0.3
info:
  title: Hopfield Assignment Solver
  version: 1.0.0
  description: |
    Request contract shared by the Go gateway (api/) and the Python solver (hopfield/).
    The limits below are the same numbers as `limits` in `validation_cases.json`, which both
    test suites enforce; `hopfield/tests/test_contract.py` fails if this file drifts from them.
paths:
  /solve:
    post:
      summary: Solve one assignment problem
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignmentRequest'}
      responses:
        '200': {description: Solved}
        '400': {description: Invalid request (the message names the offending cell or row)}
  /solve/batch:
    post:
      summary: Solve several assignment problems
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchRequest'}
      responses:
        '200': {description: Processed (each problem succeeds or fails on its own)}
        '400': {description: Invalid batch (empty, more than 100 problems, or malformed)}
components:
  schemas:
    CostMatrix:
      type: array
      description: Square matrix, 2x2 up to 50x50, finite non-negative costs.
      minItems: 2
      maxItems: 50
      items:
        type: array
        minItems: 2
        maxItems: 50
        items:
          type: number
          minimum: 0
          maximum: 1000000000
    AssignmentRequest:
      type: object
      required: [cost_matrix]
      properties:
        cost_matrix: {$ref: '#/components/schemas/CostMatrix'}
    BatchProblem:
      type: object
      required: [id, cost_matrix]
      properties:
        id: {type: string}
        cost_matrix: {$ref: '#/components/schemas/CostMatrix'}
    BatchRequest:
      type: object
      required: [problems]
      properties:
        problems:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/BatchProblem'}
